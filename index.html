.wrap::before,.wrap::after{content:"";position:absolute;width:60px;height:40px;border:3px solid var(--gold)}
.wrap::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.wrap::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.logo{width:130px;height:130px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:transparent;border:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-size:46px;font-weight:700;color:var(--gold)}
h1{font-size:34px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:10px}
.num{display:inline-flex;align-items:center;gap:8px;margin:0 auto 12px;padding:6px 18px;border:1px solid var(--gold3);border-radius:30px;background:rgba(0,0,0,.45);color:var(--gold2);text-decoration:none;font-size:19px;font-weight:700;letter-spacing:1.5px}
.num svg{width:20px;height:20px;color:var(--gold)}.num bdi{direction:ltr;unicode-bidi:isolate}
.tag{font-size:21px;font-weight:700;color:#fff}
.sub{font-size:16px;color:var(--gold2);opacity:.85;margin-top:2px}
.div{display:flex;align-items:center;gap:10px;margin:16px 24px}
.div i{flex:1;height:1px;background:var(--gold3)}
.div b{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:16px;font-weight:700;font-size:20px;border:1px solid var(--gold3)}
.main{background:linear-gradient(120deg,#f3dd9a,#c9a443 70%,#e5c870);color:#1a1205;padding:18px;margin-bottom:10px}
.row{display:flex;gap:10px}
.sec{flex:1;padding:16px 8px;color:var(--txt);background:linear-gradient(#2a1f0e,#0f0a04);font-size:18px}
svg{width:26px;height:26px;fill:currentColor}
.lbl{font-size:14px;color:var(--gold2);opacity:.8;margin:20px 0 14px}
.soc{display:flex;justify-content:space-around}
.soc a{color:var(--gold2);text-decoration:none;font-weight:600;font-size:16px}
.soc span{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 6px;border-radius:50%;border:1px solid var(--gold3);background:#1b1308}
.ttl{display:flex;align-items:center;gap:12px;margin:24px 0 14px;font-size:20px;color:var(--gold2)}
.ttl i{flex:1;height:1px;background:rgba(217,180,90,.4)}
.pay{position:relative;background:linear-gradient(#1f160a,#0f0a04);border:1px solid var(--gold3);border-radius:16px;padding:14px;margin-bottom:10px}
.best{display:flex;align-items:center;gap:12px;text-align:right}
.best .badge{position:absolute;top:-10px;right:20px;background:linear-gradient(120deg,#f3dd9a,#c9a443);color:#1a1205;font-size:12px;font-weight:700;padding:1px 14px;border-radius:12px}
.best h3{font-size:22px;color:#fff}
.best p{font-size:13px;color:var(--gold2);opacity:.85}
.ic{width:76px;height:76px;border-radius:14px;background:#fff;display:grid;place-items:center;color:#222;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:contain}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .pay{margin:0;padding:14px 6px}
.grid .ic{margin:0 auto 8px}
.grid h3{font-size:19px;color:#fff}
.grid p{font-size:13px;color:var(--gold2);margin-top:6px}
button.pay{font-family:inherit;color:inherit;cursor:pointer;width:100%;text-align:center;transition:transform .15s,border-color .15s}
button.pay:active{transform:scale(.97)}
button.pay.done{border-color:var(--gold2)}
